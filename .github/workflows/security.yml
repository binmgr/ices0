name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: binmgr/ices0

jobs:
  secret-scan:
    name: Secret scan (truffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab # v3.95.3
        with:
          path: .
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  workflow-policy:
    name: Workflow policy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify all actions are SHA-pinned
        run: |
          bad=0
          for file in .github/workflows/*.yml .gitea/workflows/*.yml .forgejo/workflows/*.yml; do
            [ -f "$file" ] || continue
            while IFS= read -r line; do
              if printf '%s' "$line" | grep -qE '^\s+uses:\s+[a-zA-Z0-9_.-]+/[a-zA-Z0-9_./-]+@'; then
                sha=$(printf '%s' "$line" | sed -E 's/.*@([^ #]+).*/\1/')
                if ! printf '%s' "$sha" | grep -qxE '[0-9a-f]{40}'; then
                  echo "::error file=${file}::Unpinned action (tag/branch not SHA): $( printf '%s' "$line" | xargs )"
                  bad=1
                fi
              fi
            done < "$file"
            if grep -qE '^\s*pull_request_target\s*:' "$file"; then
              echo "::error file=${file}::Dangerous trigger pull_request_target found"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1

  image-scan:
    name: Trivy container scan
    runs-on: ubuntu-latest
    steps:
      - name: Install Trivy
        run: |
          curl -qLSsf https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Scan published image
        run: |
          trivy image --exit-code 1 --ignore-unfixed --severity CRITICAL,HIGH \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
