name: Build Binaries

on:
  workflow_run:
    workflows: ['Build Environment Image']
    types: [completed]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: binmgr/ices0

jobs:
  build-linux:
    name: Linux (${{ matrix.arch }})
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          (
            github.event.workflow_run.head_branch == 'main' ||
            github.event.workflow_run.head_branch == 'master'
          )
        )
      }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/binmgr/ices0:build
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Build ices0
        run: build-ices0 ${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ices0-linux-${{ matrix.arch }}
          path: /output/

  build-freebsd:
    name: FreeBSD (${{ matrix.arch }})
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          (
            github.event.workflow_run.head_branch == 'main' ||
            github.event.workflow_run.head_branch == 'master'
          )
        )
      }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            vm-arch: amd64
          - arch: arm64
            vm-arch: arm64

    steps:
      - name: Build ices0 on FreeBSD
        uses: vmactions/freebsd-vm@d1e65811565151536c0c894fff74f06351ed26e6 # v1.4.5
        with:
          usesh: true
          arch: ${{ matrix.vm-arch }}
          prepare: |
            pkg install -y git autoconf automake libtool pkgconf gmake \
              libshout libogg libvorbis faad2 flac lame libxml2 \
              openssl mp4v2
          run: |
            git clone --depth 1 https://github.com/Moonbase59/ices0.git
            cd ices0

            MAJOR=$(sed -n 's/.*m4_define(ICES_MAJOR, \([0-9]*\)).*/\1/p' configure.ac)
            MINOR=$(sed -n 's/.*m4_define(ICES_MINOR, \([0-9]*\)).*/\1/p' configure.ac)
            MICRO=$(sed -n 's/.*m4_define(ICES_MICRO, \([0-9]*\)).*/\1/p' configure.ac)
            VERSION="${MAJOR}.${MINOR}.${MICRO}"

            PREFIX=/usr/local
            export CFLAGS="-std=gnu17 -Os -DWAIT_ANY=-1 -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types"
            export CPPFLAGS="-I${PREFIX}/include"
            export LDFLAGS="-L${PREFIX}/lib"
            export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig"

            autoreconf -fi
            ./configure --prefix=/usr/local \
              --without-python --without-perl \
              --with-lame="${PREFIX}" \
              --with-vorbis="${PREFIX}" \
              --with-faad="${PREFIX}" \
              --with-flac="${PREFIX}" \
              --with-xml-config="${PREFIX}/bin/xml2-config"

            gmake -j$(nproc)
            strip src/ices

            mkdir -p output
            cp src/ices output/ices0-freebsd-${{ matrix.arch }}
            echo "${VERSION}" > output/VERSION

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ices0-freebsd-${{ matrix.arch }}
          path: output/

  release:
    needs: [build-linux, build-freebsd]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get version
        id: ver
        run: echo "version=$(cat artifacts/VERSION 2>/dev/null || echo '0.0.0')" >> $GITHUB_OUTPUT

      - name: Get YYMM tag
        id: yymm
        run: echo "tag=$(date -u +'%y%m')" >> $GITHUB_OUTPUT

      - name: Prepare release
        run: |
          mkdir release && cp artifacts/ices0-* release/
          chmod +x release/* && cd release && sha256sum * > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "v${{ steps.ver.outputs.version }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v${{ steps.ver.outputs.version }}" --title "ices0 ${{ steps.ver.outputs.version }}" \
            --notes "Static ices0 binaries" release/*

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: cp release/ices0-linux-* .
      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.yymm.outputs.tag }}
