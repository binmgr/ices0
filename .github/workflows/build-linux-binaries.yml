name: Build Binaries

on:
  workflow_run:
    workflows: ['Build Environment Image']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: binmgr/ices0

jobs:
  build-linux:
    name: Linux (${{ matrix.arch }})
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          (
            github.event.workflow_run.head_branch == 'main' ||
            github.event.workflow_run.head_branch == 'master'
          )
        )
      }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          platforms: arm64

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ices0
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          docker run --rm \
            -v "$GITHUB_WORKSPACE/output:/output" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build \
            build-ices0 ${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ices0-linux-${{ matrix.arch }}
          path: ${{ github.workspace }}/output/
          retention-days: 7

  build-freebsd:
    name: FreeBSD (${{ matrix.arch }})
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          (
            github.event.workflow_run.head_branch == 'main' ||
            github.event.workflow_run.head_branch == 'master'
          )
        )
      }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            vm-arch: amd64
          - arch: arm64
            vm-arch: arm64

    steps:
      - name: Build ices0 on FreeBSD
        uses: vmactions/freebsd-vm@d1e65811565151536c0c894fff74f06351ed26e6 # v1.4.5
        with:
          usesh: true
          arch: ${{ matrix.vm-arch }}
          disable-cache: true
          prepare: |
            pkg install -y git autoconf automake libtool pkgconf gmake \
              libshout libogg libvorbis faad2 flac lame libxml2 \
              openssl mp4v2 python3 perl5
          run: |
            git clone --depth 1 https://github.com/Moonbase59/ices0.git
            cd ices0

            MAJOR=$(sed -n 's/.*m4_define(ICES_MAJOR, \([0-9]*\)).*/\1/p' configure.ac)
            MINOR=$(sed -n 's/.*m4_define(ICES_MINOR, \([0-9]*\)).*/\1/p' configure.ac)
            MICRO=$(sed -n 's/.*m4_define(ICES_MICRO, \([0-9]*\)).*/\1/p' configure.ac)
            VERSION="${MAJOR}.${MINOR}.${MICRO}"

            PREFIX=/usr/local
            export CFLAGS="-std=gnu17 -Os -DWAIT_ANY=-1 -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types"
            export CPPFLAGS="-I${PREFIX}/include"
            export LDFLAGS="-L${PREFIX}/lib"
            export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig"

            autoreconf -fi
            ./configure --prefix=/usr/local \
              --with-lame="${PREFIX}" \
              --with-vorbis="${PREFIX}" \
              --with-faad="${PREFIX}" \
              --with-flac="${PREFIX}" \
              --with-xml-config="${PREFIX}/bin/xml2-config"

            gmake -j$(nproc)
            strip src/ices

            mkdir -p output
            cp src/ices output/ices0-freebsd-${{ matrix.arch }}
            echo "${VERSION}" > output/VERSION

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ices0-freebsd-${{ matrix.arch }}
          path: ices0/output/
          retention-days: 7

  release:
    needs: [build-linux, build-freebsd]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Get version
        id: ver
        run: echo "version=$(cat artifacts/VERSION 2>/dev/null || echo '0.0.0')" >> $GITHUB_OUTPUT

      - name: Get YYMM tag
        id: yymm
        run: echo "tag=$(date -u +'%y%m')" >> $GITHUB_OUTPUT

      - name: Prepare release
        run: |
          mkdir release && cp artifacts/ices0-* release/
          chmod +x release/* && cd release && sha256sum * > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "v${{ steps.ver.outputs.version }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v${{ steps.ver.outputs.version }}" --title "ices0 ${{ steps.ver.outputs.version }}" \
            --notes "Static ices0 binaries" release/*

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: cp release/ices0-linux-* .
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.yymm.outputs.tag }}
