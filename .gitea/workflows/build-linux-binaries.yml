name: Build Linux Binaries

on:
  push:
    branches: [main, master]
    paths:
      - '.gitea/workflows/build-linux-binaries.yml'
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      SERVER_URL: ${{ gitea.server_url || github.server_url }}
      REPOSITORY: ${{ gitea.repository || github.repository }}
      GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Build build environment image
        run: docker build -f docker/Dockerfile.build -t local/ices0:build .

      - name: Build ices0 binaries
        run: |
          mkdir -p artifacts
          docker run --rm -v "$PWD/artifacts:/output" local/ices0:build build-ices0 amd64
          docker run --rm -v "$PWD/artifacts:/output" local/ices0:build build-ices0 arm64

      - name: Get version
        id: ver
        run: echo "version=$(cat artifacts/VERSION 2>/dev/null || echo '0.0.0')" >> "$GITHUB_OUTPUT"

      - name: Prepare release
        run: |
          mkdir -p release
          cp artifacts/ices0-* release/
          chmod +x release/ices0-*
          cd release
          sha256sum * > checksums.txt

      - name: Create release
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TAG="v${VERSION}"
          curl -sf -X DELETE -H "Authorization: token ${GITEA_TOKEN}" \
            "${SERVER_URL}/api/v1/repos/${REPOSITORY}/releases/tags/${TAG}" || true

          RELEASE_ID=$(curl -sf -X POST -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            "${SERVER_URL}/api/v1/repos/${REPOSITORY}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"ices0 ${VERSION}\",\"body\":\"Static ices0 binaries\"}" \
            | jq -r '.id')

          for file in release/*; do
            [ -f "$file" ] || continue
            name="$(basename "$file")"
            curl -sf -X POST -H "Authorization: token ${GITEA_TOKEN}" \
              -F "attachment=@${file}" \
              "${SERVER_URL}/api/v1/repos/${REPOSITORY}/releases/${RELEASE_ID}/assets?name=${name}"
          done
